<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Corretor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<title>Corretor de Cartões</title>
<style>
:root{--azul:#1f4e8c;--azul2:#e6eef9;--verde:#17824a;--verde2:#e1f3e8;--verm:#c0392b;--verm2:#fbe9e7;--amar:#8a6200;--amar2:#fff3cd;--txt:#18202e;--cinza:#5b6475;--borda:#d5dbe6;--fundo:#f2f4f8;--fs:19px}
body.grande{--fs:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fundo);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:var(--fs);line-height:1.4}
header.top{position:sticky;top:0;background:var(--azul);color:#fff;padding:8px 8px;display:flex;align-items:center;gap:4px;z-index:5;padding-top:max(8px,env(safe-area-inset-top))}
header.top button{background:rgba(255,255,255,.14);border:0;color:#fff;font-size:.85em;font-weight:600;padding:10px 12px;border-radius:10px;font-family:inherit;white-space:nowrap}
header.top h1{font-size:1em;margin:0 6px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bAjuda{width:44px;height:44px;padding:0;border-radius:50%;font-size:1.1em}
main{padding:14px;max-width:720px;margin:0 auto;padding-bottom:90px}
.card{background:#fff;border:1px solid var(--borda);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font-size:1.1em;margin:0 0 8px}
h2.grande{font-size:1.35em;margin:6px 0 14px;line-height:1.25}
.muted{color:var(--cinza);font-size:.88em}
.btn{text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;padding:14px;border-radius:14px;border:0;background:var(--azul);color:#fff;font-size:1em;font-weight:700;margin:10px 0;cursor:pointer;font-family:inherit;text-align:center}
.btn svg{width:30px;height:30px;flex:none}
.btn.sec{background:var(--azul2);color:var(--azul)}
.btn.verde{background:var(--verde)}
.btn.perigo{background:var(--verm2);color:var(--verm);min-height:52px;font-size:.9em}
.btn.leve{background:transparent;color:var(--azul);min-height:48px;text-decoration:underline;font-weight:600;font-size:.9em}
.btn.peq{min-height:50px;font-size:.9em}
.linha{display:flex;gap:10px}.linha>*{flex:1}
.passo{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2px solid var(--borda);border-radius:18px;padding:16px;margin-bottom:12px;font-size:1em;color:var(--txt);font-family:inherit;cursor:pointer;min-height:96px}
.passo .ic{width:62px;height:62px;border-radius:16px;background:var(--azul2);color:var(--azul);display:flex;align-items:center;justify-content:center;flex:none}
.passo .ic svg{width:40px;height:40px}
.passo b{display:block;font-size:1.05em}
.passo small{display:block;color:var(--cinza);font-size:.82em;margin-top:3px}
.passo.feito .ic{background:var(--verde2);color:var(--verde)}
.passo.prox{border-color:var(--azul);box-shadow:0 0 0 4px rgba(31,78,140,.15);animation:pulsa 1.8s ease-in-out infinite}
@keyframes pulsa{50%{box-shadow:0 0 0 8px rgba(31,78,140,.06)}}
.selo{position:absolute;top:-11px;right:14px;background:var(--azul);color:#fff;font-size:.62em;font-weight:800;padding:4px 10px;border-radius:12px;letter-spacing:.03em}
.feito .selo{background:var(--verde)}
.ok-ic{width:30px;height:30px;border-radius:50%;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;margin-left:auto;font-weight:800}
label{display:block;font-weight:700;margin:16px 0 8px}
input,select,textarea{width:100%;padding:14px;border:2px solid var(--borda);border-radius:12px;font-size:1em;background:#fff;font-family:inherit;color:var(--txt)}
input:focus,textarea:focus{outline:none;border-color:var(--azul)}
input.falta{border-color:var(--verm);background:var(--verm2)}
textarea{min-height:150px}
.stepper{display:flex;align-items:stretch;gap:10px}
.stepper button{width:72px;min-height:72px;border-radius:16px;border:0;background:var(--azul2);color:var(--azul);font-size:2em;font-weight:700;font-family:inherit}
.stepper input{text-align:center;font-size:1.8em;font-weight:800;padding:6px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.chips button{min-width:64px;min-height:56px;padding:0 14px;border-radius:14px;border:2px solid var(--borda);background:#fff;font-size:1em;font-weight:700;font-family:inherit;color:var(--txt)}
.chips button.on{background:var(--azul);border-color:var(--azul);color:#fff}
.escolha{display:block;width:100%;text-align:left;background:#fff;border:3px solid var(--borda);border-radius:16px;padding:16px;margin-bottom:12px;font-family:inherit;font-size:1em;color:var(--txt)}
.escolha.on{border-color:var(--azul);background:var(--azul2)}
.escolha .bol{display:flex;gap:8px;margin-top:10px}
.escolha .bol span{width:38px;height:38px;border-radius:50%;border:2px solid #333;display:flex;align-items:center;justify-content:center;font-size:.8em;color:#777;background:#fff}
.disc{border:2px solid var(--borda);border-radius:14px;padding:12px;margin-bottom:12px;background:#fafbfd}
.disc .det{font-size:.85em;color:var(--cinza);margin-top:8px}
.disc .avanc{display:flex;gap:8px;margin-top:10px}
.disc .avanc>div{flex:1}
.disc .avanc input{padding:10px;text-align:center}
.mini{font-size:.72em;color:var(--cinza);font-weight:700;margin-bottom:4px}
.progresso{display:flex;gap:6px;margin:4px 0 10px}
.progresso i{flex:1;height:8px;border-radius:4px;background:var(--borda)}
.progresso i.on{background:var(--azul)}
.aviso{background:var(--amar2);border:2px solid #f0d58a;border-radius:14px;padding:14px;margin-bottom:12px;font-size:.92em}
.okbox{background:var(--verde2);border:2px solid #a9dbbd;border-radius:14px;padding:14px;margin-bottom:12px;font-size:.92em}
.qrow{display:flex;align-items:center;gap:5px;padding:8px 2px;border-bottom:1px solid #eef0f5}
.qrow .st{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:3px}.qrow .st .tag{white-space:normal}
.qrow.duv{background:var(--amar2);border-radius:10px;border-bottom:0;margin-bottom:6px}
.qrow .qn{width:32px;font-weight:800;text-align:right;flex:none;margin-right:2px}
.chip{width:44px;height:44px;border-radius:50%;border:2px solid #aab3c5;background:#fff;font-weight:800;font-size:.9em;color:#4a5266;flex:none;font-family:inherit;padding:0}
.chip.on{background:var(--azul);border-color:var(--azul);color:#fff}
.chip.certo{background:var(--verde);border-color:var(--verde);color:#fff}
.chip.errado{background:var(--verm);border-color:var(--verm);color:#fff}
.chip.gab{border-color:var(--verde);border-width:4px;color:var(--verde)}
.chip.anul{width:auto;flex:0 1 auto;padding:0 6px;border-radius:22px;font-size:.62em;margin-left:auto}
.chip.anul.on{background:#555;border-color:#555}
.tag{font-size:.68em;padding:3px 8px;border-radius:10px;background:#eceef2;color:#4a5266;margin-left:4px;white-space:nowrap;font-weight:700}
.tag.m{background:var(--verm2);color:var(--verm)}
.tag.d{background:var(--amar2);color:var(--amar)}
table{border-collapse:collapse;width:100%;font-size:.85em}
th,td{padding:10px 8px;border-bottom:1px solid #eef0f5;text-align:center;white-space:nowrap}
th{background:#f4f6fa;font-size:.8em;color:#4a5266}
td.nome,th.nome{text-align:left;white-space:normal;min-width:120px}
.tabwrap{overflow-x:auto;border:1px solid var(--borda);border-radius:14px;background:#fff}
tr.click{cursor:pointer}
.barra{height:12px;background:#eef0f5;border-radius:6px;overflow:hidden}
.barra i{display:block;height:100%}
.notas{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.notas div{background:var(--azul2);border-radius:12px;padding:8px 12px;font-size:.78em;min-width:30%}
.notas div b{font-size:1.6em;display:block;color:var(--azul)}
.ilus{display:flex;justify-content:center;margin:6px 0 10px;color:var(--azul)}
.ilus svg{width:150px;height:150px}
.centro{text-align:center}
.grandeOk{width:96px;height:96px;border-radius:50%;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;margin:14px auto}
.grandeOk svg{width:60px;height:60px}
details{background:#fff;border:1px solid var(--borda);border-radius:14px;margin-bottom:14px}
details summary{padding:16px;font-weight:700;cursor:pointer;color:var(--azul);list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ "}
details[open] summary::before{content:"▾ "}
details .dentro{padding:0 10px 10px}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#18202e;color:#fff;padding:14px 20px;border-radius:26px;font-size:.9em;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(10,15,30,.6);z-index:60;display:none;align-items:center;justify-content:center;padding:18px}
#modal.on{display:flex}
#modal .mbox{background:#fff;border-radius:18px;padding:20px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
#modal h3{margin:0 0 10px;font-size:1.15em}
#modal .mtxt{margin:0 0 8px;white-space:pre-line}
#modal ol{padding-left:22px;margin:8px 0}#modal li{margin:8px 0}
#carregando{position:fixed;inset:0;background:rgba(255,255,255,.9);z-index:65;display:none;align-items:center;justify-content:center;flex-direction:column;font-weight:700;font-size:1.1em;color:var(--azul)}
#carregando.on{display:flex}
.giro{width:56px;height:56px;border:6px solid var(--azul2);border-top-color:var(--azul);border-radius:50%;animation:gira 1s linear infinite;margin-bottom:16px}
@keyframes gira{to{transform:rotate(360deg)}}
/* câmera */
#cam{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#cam.on{display:flex}
#camBox{position:relative;flex:1;overflow:hidden}
#camBox video,#camBox canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#camMsg{position:absolute;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));background:rgba(0,0,0,.7);color:#fff;padding:14px 16px;border-radius:14px;font-size:1em;text-align:center;font-weight:700}
#camMsg.verde{background:rgba(23,130,74,.95)}
#camMsg.alerta{background:rgba(185,110,0,.95)}
#camRes{position:absolute;left:12px;right:12px;bottom:56px;background:rgba(255,255,255,.97);border-radius:14px;padding:10px;display:none;color:#18202e;font-size:1em;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.4)}
#camRes.on{display:block}
#camRes img{width:100%;border-radius:8px;border:1px solid #ccc;display:block;margin-bottom:6px;background:#fff}
#camRes b{font-size:1.4em;color:#17824a}
#camBar{display:flex;gap:8px;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:#111}
#camBar button{flex:1;min-height:58px;border-radius:14px;border:0;background:#2b2f3a;color:#fff;font-size:.85em;font-weight:700;font-family:inherit}
#camCont{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.65);color:#fff;padding:8px 14px;border-radius:18px;font-size:.8em;font-weight:700}
.cardprev{background:#fff;border:1px solid var(--borda);border-radius:12px;overflow:hidden}
.cardprev svg{width:100%;height:auto;display:block}
img.ass{width:100%;max-width:100%;height:auto;display:block;border:2px solid var(--azul);border-radius:10px;background:#fff}
canvas#prev{width:100%;border-radius:12px;border:1px solid var(--borda);display:block;background:#fff}
#printArea{display:none}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea svg{width:210mm;height:297mm;display:block}
}
</style>
</head>
<body>
<header class="top"><button id="bVoltar" aria-label="Voltar">&#8249; Voltar</button><h1 id="titulo">Corretor de Cartões</h1><button id="bAjuda" aria-label="Ajuda">?</button></header>
<main id="tela"></main>

<div id="cam">
  <div id="camBox"><video id="video" playsinline muted autoplay></video><canvas id="ov"></canvas><div id="camMsg">Abrindo a câmera…</div><div id="camCont"></div><div id="camRes"></div></div>
  <div id="camBar"><button id="cSair">&#8249; Sair</button><button id="cDesf" style="display:none">Desfazer o último</button><button id="cLuz">Lanterna</button><button id="cFoto">Tirar foto</button></div>
</div>
<input type="file" id="arqFoto" accept="image/*" capture="environment" style="display:none">
<input type="file" id="arqBackup" accept="application/json,.json" style="display:none">
<div id="printArea"></div>
<div id="toast"></div>
<div id="modal"><div class="mbox"><h3 id="mTit"></h3><div class="mtxt" id="mTxt"></div><div id="mBot"></div></div></div>
<div id="carregando"><div class="giro"></div><div id="carTxt">Lendo o cartão…</div></div>

<script>
"use strict";
/* ============ armazenamento ============ */
const CHAVE='corretor_cartoes_v1';
const LET='ABCDE';
let DB=carregar();
function carregar(){try{const s=localStorage.getItem(CHAVE);if(s){const d=JSON.parse(s);if(d&&Array.isArray(d.provas))return d}}catch(e){}return{provas:[],ativa:null}}
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(DB))}catch(e){toast('Atenção: não consegui guardar os dados neste aparelho.')}}
function prova(){return DB.provas.find(p=>p.id===DB.ativa)||null}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function $(s){return document.querySelector(s)}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}
function fmt(n){return (Math.round(n*10)/10).toFixed(1).replace('.',',')}
function nomeAluno(p,num){if(num==null)return'';const l=(p.alunos||'').split('\n').map(s=>s.trim());return l[num-1]||''}

function novaProva(){
  const p={id:uid(),nome:'Prova',turma:'',nQ:40,nAlt:5,disc:[],gab:[],alunos:'',res:[],criada:Date.now()};
  p.disc=dividir(40,4);p.gab=Array(40).fill(-1);return p;
}
function dividir(nQ,k){const out=[];let ini=1;for(let i=0;i<k;i++){const tam=Math.floor(nQ/k)+(i<nQ%k?1:0);out.push({nome:'Disciplina '+(i+1),de:ini,ate:ini+tam-1,valor:10});ini+=tam}return out}

/* ============ provas por área (modelo da escola) ============ */
const AREAS={
 mat:{nome:'Matemática e Ciências da Natureza',curto:'Matemática e Natureza',disc:['Matemática','Biologia','Física','Química']},
 ling:{nome:'Linguagens',curto:'Linguagens',disc:['Arte','Educação Física','Língua Inglesa','Língua Portuguesa']},
 hum:{nome:'Ciências Humanas',curto:'Humanas',disc:['Filosofia','Geografia','História','Sociologia']}
};
function provaArea(ar,so){const A=AREAS[ar];const p={id:uid(),nome:A.nome,turma:'',nQ:40,nAlt:5,area:ar,so:so,
  disc:A.disc.map((n,i)=>({nome:n,de:i*10+1,ate:i*10+10,valor:10})),gab:Array(40).fill(-1),alunos:'',res:[],criada:Date.now(),impresso:true};return p}
function discAtivas(p){return (p.so>=0&&p.disc[p.so])?[p.disc[p.so]]:p.disc}
function ativas(p){const out=[];for(const d of discAtivas(p))for(let q=d.de;q<=d.ate;q++)if(q>=1&&q<=p.nQ)out.push(q-1);return p.so>=0?out:Array.from({length:p.nQ},(_,i)=>i)}
function gabCompleto(p){return ativas(p).every(i=>p.gab[i]!==-1)}
function tituloProva(p){return p.so>=0&&p.disc[p.so]?p.disc[p.so].nome:p.nome}

/* ============ correção ============ */
function corrigir(p,resp){
  const out=[];let tot=0;
  for(const d of discAtivas(p)){
    let ac=0,n=0;
    for(let q=d.de;q<=d.ate;q++){const i=q-1;if(i<0||i>=p.nQ)continue;n++;const g=p.gab[i];
      if(g===-3||(g>=0&&resp[i]===g))ac++;}
    tot+=ac;out.push({nome:d.nome,ac,n,nota:n?d.valor*ac/n:0,valor:d.valor});
  }
  return{disc:out,ac:tot};
}

/* ============ layout do cartão (milímetros) ============ */
const MK=[[12,12],[198,12],[12,285],[198,285]]; // TL TR BL BR (centros)
const MKS=10;
const BAR={x:24,y:8.5,w:50,h:3.5};
const HDR=7;
const MAREA=['mat','ling','hum'],XAREA=[80,86,92]; // quadradinhos que identificam a área do cartão
const ASS={x:23,y:31,w:164,h:14}; // área do nome do aluno no cartão (mm)
function layout(p){
  const nQ=p.nQ,nA=p.nAlt,d=4.8,sp=6.6,rowH=7.0,top=62,bot=279,x0=17,x1=193;
  const maxRows=Math.floor((bot-top)/rowH);
  const colW=9+nA*sp;
  const maxCols=Math.max(1,Math.floor((x1-x0+3)/(colW+3)));
  let nCols=Math.min(maxCols,Math.max(Math.ceil(nQ/maxRows),Math.ceil(nQ/20),1));
  const rows=Math.ceil(nQ/nCols);
  const slot=(x1-x0)/nCols;
  const qs=[];
  for(let q=0;q<nQ;q++){
    const c=Math.floor(q/rows),r=q%rows;
    const cx0=x0+c*slot+(slot-colW)/2;
    let cy=top+r*rowH+rowH/2;
    if(p.area){const ini=c*rows;const nh=p.disc.filter(d=>d.de-1>=ini&&d.de-1<=q).length;cy+=nh*HDR}
    const alts=[];for(let k=0;k<nA;k++)alts.push([cx0+9+sp*k+sp/2,cy]);
    qs.push({q,c,r,cx0,cy,alts,colW});
  }
  const heads=[];if(p.area)for(const d of p.disc){const Q=qs[d.de-1];if(Q)heads.push({nome:d.nome,de:d.de,ate:d.ate,x:Q.cx0,y:Q.cy-rowH/2-HDR,w:colW})}
  return{qs,d,rowH,colW,heads,maxQ:maxCols*maxRows};
}
function maxQuestoes(nAlt){return layout({nQ:1,nAlt}).maxQ}

function cardSVG(p,fill){
  const L=layout(p),r=L.d/2;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm" font-family="Arial,Helvetica,sans-serif">`;
  s+=`<rect width="210" height="297" fill="#fff"/>`;
  for(const[x,y]of MK)s+=`<rect x="${x-MKS/2}" y="${y-MKS/2}" width="${MKS}" height="${MKS}" fill="#000"/>`;
  s+=`<rect x="${BAR.x}" y="${BAR.y}" width="${BAR.w}" height="${BAR.h}" fill="#000"/>`;
  if(p.area)XAREA.forEach((x,i)=>{if(MAREA[i]===p.area)s+=`<rect x="${x}" y="${BAR.y}" width="3.5" height="${BAR.h}" fill="#000"/>`});
  s+=`<text x="24" y="21.5" font-size="5" font-weight="700">CARTÃO-RESPOSTA</text>`;
  s+=`<text x="24" y="27.5" font-size="3.4">${esc((p.nome||'').slice(0,48))}${p.turma?' · '+esc(p.turma.slice(0,20)):''}</text>`;
  s+=`<text x="${ASS.x+1}" y="${ASS.y+3.2}" font-size="2.6" fill="#555">Nome do aluno (escreva com letra legível)</text><rect x="${ASS.x}" y="${ASS.y}" width="${ASS.w}" height="${ASS.h}" rx="1" fill="none" stroke="#000" stroke-width="0.3"/>`;
  if(fill&&fill.nome)s+=`<text x="${ASS.x+4}" y="${ASS.y+(fill.nomeY||10)}" font-size="${fill.nomeTam||6}" font-family="cursive" fill="#1b2a6b">${esc(fill.nome)}</text>`; // nomeY/nomeTam: só para testes
  s+=`<text x="24" y="51" font-size="3.3">Turma:</text><line x1="36" y1="51.6" x2="80" y2="51.6" stroke="#000" stroke-width="0.25"/>`;
  s+=`<text x="90" y="51" font-size="3.3">Data:</text><line x1="99" y1="51.6" x2="140" y2="51.6" stroke="#000" stroke-width="0.25"/>`;

function svgParaCanvas(svg,fn){toast('Gerando o arquivo…');const img=new Image();const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));

function pdfPaginas(pgs){
  const enc=new TextEncoder(),partes=[],offs=[];let pos=0;const add=x=>{const b=typeof x==='string'?enc.encode(x):x;partes.push(b);pos+=b.length};
  const n=pgs.length,obj=(k,str)=>{offs[k]=pos;add(str)};
  add('%PDF-1.4\n');obj(1,'1 0 obj <</Type/Catalog/Pages 2 0 R>> endobj\n');
  obj(2,`2 0 obj <</Type/Pages/Kids[${pgs.map((_,i)=>(3+i*3)+' 0 R').join(' ')}]/Count ${n}>> endobj\n`);
  pgs.forEach((g,i)=>{const P=3+i*3,I=P+1,C=P+2,cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(P,`${P} 0 obj <</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</Im0 ${I} 0 R>>>>/Contents ${C} 0 R>> endobj\n`);
    obj(I,`${I} 0 obj <</Type/XObject/Subtype/Image/Width ${g.w}/Height ${g.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${g.jpg.length}>> stream\n`);add(g.jpg);add('\nendstream endobj\n');
    obj(C,`${C} 0 obj <</Length ${cs.length}>> stream\n${cs}\nendstream endobj\n`)});
  const tot=3+n*3,xr=pos;let t=`xref\n0 ${tot}\n0000000000 65535 f \n`;for(let i=1;i<tot;i++)t+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  add(t+`trailer <</Size ${tot}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);return new Blob(partes,{type:'application/pdf'});
}
function pdfDeJpeg(jpg,w,h){
  const enc=new TextEncoder(),partes=[],offs=[];let pos=0;
  const add=x=>{const b=typeof x==='string'?enc.encode(x):x;partes.push(b);pos+=b.length};
  const obj=(n,str)=>{offs[n]=pos;add(str)};
  add('%PDF-1.4\n%\xE2\xE3\n');
  obj(1,'1 0 obj <</Type/Catalog/Pages 2 0 R>> endobj\n');
  obj(2,'2 0 obj <</Type/Pages/Kids[3 0 R]/Count 1>> endobj\n');
  obj(3,'3 0 obj <</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>> endobj\n');
  obj(4,`4 0 obj <</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>> stream\n`);add(jpg);add('\nendstream endobj\n');
  const cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
  obj(5,`5 0 obj <</Length ${cs.length}>> stream\n${cs}\nendstream endobj\n`);
  const xr=pos;let t='xref\n0 6\n0000000000 65535 f \n';for(let i=1;i<=5;i++)t+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  add(t+`trailer <</Size 6/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(partes,{type:'application/pdf'});
}

  baixarDireto(blob,nome)}
function baixarDireto(blob,nome){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

function tabela(p,sep,csv){
  const q=v=>{v=String(v==null?'':v);return csv&&/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const A=ativas(p),DA=discAtivas(p);
  const cab=['Ordem',...DA.map(d=>d.nome+' (vale '+fmt(d.valor)+')'),'Acertos','Respostas'];
  const L=[cab.map(q).join(sep)];
  ordenaRes(p.res).forEach((r,ix)=>{const c=corrigir(p,r.resp);
    L.push([ix+1,...c.disc.map(x=>fmt(x.nota)),c.ac+' de '+A.length,A.map(i=>{const v=r.resp[i];return v>=0?LET[v]:v===-2?'*':'-'}).join('')].map(q).join(sep))});
  L.push(['Gabarito',...DA.map(()=>''),'',A.map(i=>{const v=p.gab[i];return v>=0?LET[v]:v===-3?'X':'-'}).join('')].map(q).join(sep));
  return L.join('\r\n');
}
function ordenaRes(res){return res.slice().sort((a,b)=>a.data-b.data)}

  return{
    put:(k,v)=>db().then(d=>new Promise(r=>{const t=d.transaction('ass','readwrite');t.objectStore('ass').put(v,k);t.oncomplete=()=>r();t.onerror=()=>{mem[k]=v;r()}})).catch(()=>{mem[k]=v}),
    get:k=>db().then(d=>new Promise(r=>{const q=d.transaction('ass').objectStore('ass').get(k);q.onsuccess=()=>r(q.result||mem[k]||null);q.onerror=()=>r(mem[k]||null)})).catch(()=>mem[k]||null),
    del:k=>db().then(d=>{d.transaction('ass','readwrite').objectStore('ass').delete(k)}).catch(()=>{delete mem[k]})
  }})();

/* ---- compartilhar a prova entre professores ---- */
function b64u(str){const b=new TextEncoder().encode(str);let s='';b.forEach(c=>s+=String.fromCharCode(c));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function deB64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return new TextDecoder().decode(b)}
function codigoProva(p){return b64u(JSON.stringify({v:1,id:p.id,ar:p.area||'',so:p.so>=0?p.so:-1,n:p.nome,q:p.nQ,a:p.nAlt,d:p.disc.map(d=>[d.nome,d.de,d.ate,d.valor]),g:p.gab.map(v=>v>=0?LET[v]:v===-3?'X':'-').join('')}))}
function linkProva(p){return location.origin+location.pathname+'#receber='+codigoProva(p)}
function lerCodigo(txt){
  try{txt=String(txt||'').trim();const m=txt.match(/receber=([A-Za-z0-9_-]+)/);const c=m?m[1]:(txt.match(/^[A-Za-z0-9_-]{20,}$/)||[])[0];if(!c)return null;
    const o=JSON.parse(deB64u(c));if(o.v!==1||!o.id||!(o.q>=1&&o.q<=120)||!(o.a===4||o.a===5)||!Array.isArray(o.d)||typeof o.g!=='string'||o.g.length!==o.q)return null;
    return{id:String(o.id),nome:String(o.n||'Prova'),nQ:o.q,nAlt:o.a,disc:o.d.map(x=>({nome:String(x[0]),de:+x[1],ate:+x[2],valor:+x[3]})),gab:o.g.split('').map(ch=>ch==='X'?-3:ch==='-'?-1:LET.indexOf(ch)),area:AREAS[o.ar]?o.ar:undefined,so:o.so>=0?o.so:-1}}catch(e){return null}}

/* ---- editor de disciplinas (usado no assistente e nos ajustes) ---- */
function discHTML(t,aberto){
  let h=`<div class="chips" id="dQtd">${[1,2,3,4,5,6].map(k=>`<button data-k="${k}" class="${k===t.disc.length?'on':''}">${k}</button>`).join('')}</div><div style="height:14px"></div>`;
  t.disc.forEach((d,i)=>{h+=`<div class="disc"><div class="mini">NOME DA ${t.disc.length>1?(i+1)+'ª ':''}DISCIPLINA</div><input data-i="${i}" data-k="nome" value="${esc(d.nome)}" maxlength="30" placeholder="Ex.: Matemática">
    <div class="det" id="det${i}">Questões ${d.de} a ${d.ate} · vale ${fmt(d.valor)} pontos</div>
    <div class="avanc" style="display:${aberto?'flex':'none'}"><div><div class="mini">DA QUESTÃO</div><input data-i="${i}" data-k="de" type="number" inputmode="numeric" value="${d.de}"></div><div><div class="mini">ATÉ A</div><input data-i="${i}" data-k="ate" type="number" inputmode="numeric" value="${d.ate}"></div><div><div class="mini">VALE</div><input data-i="${i}" data-k="valor" type="number" inputmode="decimal" step="0.5" value="${d.valor}"></div></div></div>`});
  h+=`<button class="btn leve" id="dAv">${aberto?'Esconder questões e valores':'Mudar as questões ou o valor de cada disciplina'}</button><div id="dProb"></div>`;
  return h;
}
function discLiga(t,box,aberto,redesenha){
  box.innerHTML=discHTML(t,aberto);
  box.querySelectorAll('#dQtd button').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,nomes=t.disc.map(d=>d.nome),val=t.disc[0]?t.disc[0].valor:10;t.disc=dividir(t.nQ,k);t.disc.forEach((d,i)=>{d.valor=val;if(nomes[i]&&!/^Disciplina \d+$/.test(nomes[i]))d.nome=nomes[i]});discLiga(t,box,aberto,redesenha)});
  box.querySelectorAll('.disc input').forEach(inp=>inp.oninput=()=>{const d=t.disc[+inp.dataset.i],k=inp.dataset.k;d[k]=k==='nome'?inp.value:(parseFloat(String(inp.value).replace(',','.'))||0);
    box.querySelector('#det'+inp.dataset.i).textContent=`Questões ${d.de} a ${d.ate} · vale ${fmt(d.valor)} pontos`;mostraProb(t,box)});
  box.querySelector('#dAv').onclick=()=>discLiga(t,box,!aberto,redesenha);
  mostraProb(t,box);
}
function problemasDisc(t){const pr=[],cob=Array(t.nQ).fill(0);
  t.disc.forEach(d=>{if(d.de<1||d.ate>t.nQ||d.de>d.ate)pr.push(`"${d.nome}" está com as questões erradas (${d.de} a ${d.ate}).`);else for(let q=d.de;q<=d.ate;q++)cob[q-1]++});
  const sem=cob.map((c,i)=>c===0?i+1:0).filter(Boolean),dup=cob.map((c,i)=>c>1?i+1:0).filter(Boolean);
  if(sem.length)pr.push('Estas questões não estão em nenhuma disciplina: '+resumo(sem)+'.');if(dup.length)pr.push('Estas questões estão em duas disciplinas: '+resumo(dup)+'.');return pr}
function mostraProb(t,box){const pr=problemasDisc(t);box.querySelector('#dProb').innerHTML=pr.length?`<div class="aviso">${pr.map(esc).join('<br>')}</div>`:''}
function stepperLiga(inp,min,max,onCh){const set=v=>{v=Math.max(min,Math.min(max,v||min));inp.value=v;onCh(v)};
  inp.parentNode.querySelectorAll('button').forEach(b=>b.onclick=()=>set((parseInt(inp.value)||0)+(+b.dataset.d)));inp.onchange=()=>set(parseInt(inp.value))}
function stepperHTML(id,v){return `<div class="stepper"><button data-d="-1" aria-label="Menos">−</button><input id="${id}" type="number" inputmode="numeric" value="${v}"><button data-d="1" aria-label="Mais">+</button></div>`}
function escolhaLetras(n){return [4,5].map(k=>`<button class="escolha ${n===k?'on':''}" data-a="${k}"><b>${k===4?'A, B, C e D':'A, B, C, D e E'}</b><div class="bol">${LET.slice(0,k).split('').map(l=>`<span>${l}</span>`).join('')}</div></button>`).join('')}
function ajustaNQ(t,v){t.nQ=v;
  // reajusta disciplinas mantendo nomes e valores
  const nomes=t.disc.map(d=>d.nome),vals=t.disc.map(d=>d.valor);t.disc=dividir(v,Math.min(t.disc.length||1,v));t.disc.forEach((d,i)=>{d.nome=nomes[i]||d.nome;d.valor=vals[i]??10})}

  $('#tela').innerHTML=h;
  if(i===0){$('#aNome').oninput=e=>t.nome=e.target.value;$('#aTurma').oninput=e=>t.turma=e.target.value}
  if(i===1){const max=maxQuestoes(t.nAlt);stepperLiga($('#aNQ'),1,max,v=>{ajustaNQ(t,v);document.querySelectorAll('#aAtal button').forEach(b=>b.classList.toggle('on',+b.dataset.v===v))});
    document.querySelectorAll('#aAtal button').forEach(b=>b.onclick=()=>{$('#aNQ').value=b.dataset.v;$('#aNQ').onchange()})}
  if(i===2)document.querySelectorAll('.escolha').forEach(b=>b.onclick=()=>{t.nAlt=+b.dataset.a;if(t.nQ>maxQuestoes(t.nAlt))ajustaNQ(t,maxQuestoes(t.nAlt));render()});
  if(i===3)discLiga(t,$('#aDisc'),false);
  $('#aProx').onclick=async()=>{
    if(i===0&&!t.nome.trim()){$('#aNome').classList.add('falta');$('#aNome').focus();toast('Escreva o nome da prova');return}
    if(i===3){const pr=problemasDisc(t);if(pr.length){aviso('Confira as disciplinas',pr.map(esc).join('<br><br>'));return}}
    if(i<N-1){a.passo++;render();return}
    t.nome=t.nome.trim();t.turma=t.turma.trim();t.disc.forEach((d,k)=>{if(!d.nome.trim())d.nome='Disciplina '+(k+1)});t.gab=Array(t.nQ).fill(-1);
    DB.provas.push(t);DB.ativa=t.id;salvar();toast('Prova criada');irInicioProva();
  };
};

/* ---- prova (passos) ---- */
function proximoPasso(p){const gabOk=gabCompleto(p);if(!p.impresso)return 1;if(!gabOk)return 2;if(!p.enviada&&!p.res.length)return 3;return 4}
TELAS.prova=()=>{
  const p=prova();if(!p){atual={tela:'inicio'};return render()}
  titulo(tituloProva(p));
  const A=ativas(p),gabN=A.filter(i=>p.gab[i]!==-1).length,gabOk=gabN===A.length;
  const passo=(n,id,ic,tit,sub,feito,nx)=>`<button class="passo ${n===nx?'prox':''} ${feito?'feito':''}" id="${id}"><span class="ic">${ic}</span><span><b>${tit}</b><small>${sub}</small></span>${n===nx?'<span class="selo">PRÓXIMO PASSO</span>':feito?'<span class="ok-ic">✓</span>':''}</button>`;
  const subCor=p.res.length?`${p.res.length} já corrigidos. Toque para continuar`:'Fotografe o cartão de cada aluno';
  const subNot=p.res.length?`Notas de ${p.res.length} ${p.res.length===1?'aluno':'alunos'}`:'Aparecem depois de corrigir';
  const faixa=p.so>=0&&p.disc[p.so]?`questões ${p.disc[p.so].de} a ${p.disc[p.so].ate}`:`${p.nQ} questões`;
  let h=`<div class="muted" style="margin:0 4px 12px">${p.area?esc(AREAS[p.area].curto)+' · ':p.recebida?'Prova recebida · ':''}${p.turma?esc(p.turma)+' · ':''}${faixa}</div>`;
  if(p.recebida||p.area){
    const nx=gabOk?2:1;
    h+=passo(1,'sGab',IC.gabarito,'1. Marcar o gabarito',gabOk?'Gabarito completo. Toque para conferir':gabN?`Faltam ${A.length-gabN} questões`:`Toque na resposta certa das ${faixa}`,gabOk,nx)
     +passo(2,'sCor',IC.camera,'2. Corrigir os cartões',subCor,false,nx)
     +passo(3,'sNot',IC.notas,'3. Ver as notas',subNot,p.res.length>0,nx)
     +`<div style="height:12px"></div><button class="btn sec" id="sImp">${IC.impressora} Imprimir cartões em branco</button><button class="btn sec" id="sEnv">${IC.enviar} Mandar o gabarito para um colega</button><button class="btn sec" id="sCfg">${IC.alunos} Mudar a turma</button>`;
  }else{
    const nx=proximoPasso(p);
    h+=passo(1,'sImp',IC.impressora,'1. Imprimir os cartões',p.impresso?'Cartão já baixado':'Baixe e imprima o cartão-resposta',p.impresso,nx)
     +passo(2,'sGab',IC.gabarito,'2. Marcar o gabarito',gabOk?'Gabarito completo':gabN?`Faltam ${A.length-gabN} questões`:'Diga a resposta certa de cada questão',gabOk,nx)
     +passo(3,'sEnv',IC.enviar,'3. Enviar para os colegas',p.enviada?'Já enviado. Toque para enviar de novo':'Os outros professores recebem a prova pronta para corrigir',!!p.enviada,nx)
     +passo(4,'sCor',IC.camera,'4. Corrigir os cartões',subCor,false,nx)
     +passo(5,'sNot',IC.notas,'5. Ver as notas',subNot,p.res.length>0,nx)
     +`<button class="btn sec" id="sCfg" style="margin-top:22px">${IC.ajustes} Mudar dados da prova</button>`;
  }
  $('#tela').innerHTML=h;
  $('#sImp').onclick=()=>ir('cartao');$('#sGab').onclick=()=>ir('gabarito');if($('#sEnv'))$('#sEnv').onclick=()=>ir('enviar');
  $('#sCor').onclick=async()=>{if(!gabOk){const r=await janela('Falta o gabarito',`Ainda faltam <b>${A.length-gabN}</b> questões no gabarito. Sem o gabarito o app não sabe o que está certo.`,[{t:'Marcar o gabarito agora'},{t:'Corrigir mesmo assim',cls:'sec'}]);if(r===0){ir('gabarito');return}}
    corrigirCartao('corrigir')};
  $('#sNot').onclick=()=>ir('notas');$('#sCfg').onclick=()=>ir('config');
};

/* ============ câmera ============ */
let cam={stream:null,modo:null,rodando:false,est:0,ult:null,armado:true,perdido:0,track:null,luz:false,falhou:false,ocupado:false,lendo:false,manter:false,ultimo:null,pausa:0};
const video=$('#video'),ov=$('#ov'),cMsg=$('#camMsg');
const peq=document.createElement('canvas'),peqx=peq.getContext('2d',{willReadFrequently:true});
const grande=document.createElement('canvas'),grandex=grande.getContext('2d',{willReadFrequently:true});
function podeAoVivo(){return !cam.falhou&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)&&window.isSecureContext!==false&&window.self===window.top}
// modo contínuo: leitura sem dúvida é salva sozinha e a câmera já espera o próximo cartão
function modoContinuo(){return cam.modo==='corrigir'&&!DB.cfg.conferirTodos}

/* ---- leitura em segundo plano (Web Worker), para a câmera não travar ---- */
// só procura o cartão num quadro pequeno; confirma pela faixa preta do topo que é mesmo o cartão
function detectarRapido(d,w,h){
  const g=toGray({data:d,width:w,height:h}),q=detectMarkers(g,w,h);if(!q)return null;
  const pts=q.map(c=>[c.x,c.y]);let H=homografia(MK,pts),ok=!!(H&&barraOk(g,w,h,H));
  if(!ok){const r=[pts[3],pts[2],pts[1],pts[0]];H=homografia(MK,r);ok=!!(H&&barraOk(g,w,h,H))}
  const[a,b,c,e]=q;const area=Math.abs((e.x-a.x)*(b.y-c.y)-(b.x-c.x)*(e.y-a.y))/2;
  return{q:q.map(c=>({x:c.x,y:c.y})),ok,frac:area/(w*h)};
}
let LEITOR=null;const pend={};let seqL=0;
function criaLeitor(){
  try{const fns=[toGray,downscale,detectMarkers,ordena,dist,pontua,refina,homografia,aplica,amostra,mediaCirculo,barraOk,decide,escuro,processa,layout,detectarRapido];
    const consts=`const MK=${JSON.stringify(MK)},MKS=${MKS},BAR=${JSON.stringify(BAR)},HDR=${HDR},MAREA=${JSON.stringify(MAREA)},XAREA=${JSON.stringify(XAREA)},LIM=${LIM},FAIXA=${FAIXA};\n`;
    const src=consts+fns.map(f=>f.toString()).join('\n')+`
onmessage=e=>{const m=e.data;let r;try{r=m.t==='det'?detectarRapido(m.d,m.w,m.h):processa({data:m.d,width:m.w,height:m.h},m.p)}catch(x){r=m.t==='det'?null:{ok:false,msg:'erro'}}postMessage({n:m.n,r})};`;
    const wk=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
    wk.onmessage=e=>{const f=pend[e.data.n];delete pend[e.data.n];if(f)f(e.data.r)};
    wk.onerror=()=>{LEITOR=false};return wk}catch(e){return false}
}
// manda o trabalho para o worker; se não houver worker, faz aqui mesmo
function trabalho(t,d,w,h,p){
  if(LEITOR===null)LEITOR=criaLeitor();
  if(!LEITOR)return Promise.resolve(t==='det'?detectarRapido(d,w,h):processa({data:d,width:w,height:h},p));
  return new Promise(res=>{const n=++seqL;pend[n]=res;const buf=d.buffer;LEITOR.postMessage({t,n,d,w,h,p},[buf])});
}
function provaLeve(p){return{nQ:p.nQ,nAlt:p.nAlt,area:p.area,disc:p.disc}}

// ponto de entrada: câmera ao vivo quando dá; senão, a câmera do próprio celular (foto)
function corrigirCartao(modo){cam.modo=modo;if(podeAoVivo())abrirCamera(modo);else $('#arqFoto').click()}
function msg(t,v){cMsg.textContent=t;cMsg.classList.toggle('verde',v===true);cMsg.classList.toggle('alerta',v==='alerta')}
async function abrirCamera(modo){
  cam.modo=modo;cam.armado=true;cam.est=0;cam.ult=null;cam.lendo=false;
  $('#cam').classList.add('on');atualizaCont();msg('Abrindo a câmera…');
  if(!cam.stream){
    try{cam.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false})}
    catch(e){cam.falhou=true;fecharCamera();
      const r=await janela('Câmera não liberou','O celular não deixou o app usar a câmera ao vivo. Você ainda pode corrigir tirando uma foto de cada cartão.',[{t:IC.camera+' Tirar foto do cartão'},{t:'Voltar',cls:'sec'}]);
      if(r===0)$('#arqFoto').click();return}
    video.srcObject=cam.stream;cam.track=cam.stream.getVideoTracks()[0];
    try{await video.play()}catch(e){}
    try{const cp=cam.track.getCapabilities&&cam.track.getCapabilities();$('#cLuz').style.display=cp&&cp.torch?'':'none';
      if(cp&&cp.focusMode&&cp.focusMode.includes('continuous'))cam.track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{})}catch(e){$('#cLuz').style.display='none'}
  }
  if(!cam.rodando){cam.rodando=true;msg('Mostre o cartão inteiro, com os 4 quadrados pretos');laco()}
}
function fecharCamera(){cam.rodando=false;$('#cam').classList.remove('on');if(cam.stream){cam.stream.getTracks().forEach(t=>t.stop());cam.stream=null;video.srcObject=null}cam.luz=false;cam.ultimo=null;$('#cDesf').style.display='none'}
function atualizaCont(){const p=prova();$('#camCont').textContent=cam.modo==='gabarito'?'Lendo o gabarito':(p?p.res.length+(p.res.length===1?' corrigido':' corrigidos'):'')}
$('#cSair').onclick=()=>{fecharCamera();render()};
$('#cLuz').onclick=()=>{if(!cam.track)return;cam.luz=!cam.luz;cam.track.applyConstraints({advanced:[{torch:cam.luz}]}).catch(()=>toast('Lanterna indisponível'))};
$('#cFoto').onclick=()=>$('#arqFoto').click();
$('#cDesf').onclick=async()=>{const p=prova();if(!p||!cam.ultimo)return;const r=p.res.find(x=>x.id===cam.ultimo);if(!r)return;
  cam.rodando=false;const ok=await pergunta('Apagar a última correção salva?','Sim, apagar');cam.rodando=true;laco();
  if(!ok)return;p.res=p.res.filter(x=>x.id!==r.id);IDB.del(r.id);salvar();cam.ultimo=null;$('#cDesf').style.display='none';atualizaCont();toast('A última correção foi apagada')};
$('#arqFoto').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;carregando(true,'Lendo o cartão…');
  const img=new Image();const url=URL.createObjectURL(f);
  img.onerror=()=>{carregando(false);URL.revokeObjectURL(url);mostraFalha()};
  img.onload=()=>{setTimeout(()=>{try{
    const s=Math.min(1,2400/Math.max(img.width,img.height));grande.width=Math.round(img.width*s);grande.height=Math.round(img.height*s);grandex.drawImage(img,0,0,grande.width,grande.height);URL.revokeObjectURL(url);
    const id=grandex.getImageData(0,0,grande.width,grande.height);const R=processa(id,prova());carregando(false);
    if(!R.ok){mostraFalha();return}bip();lido(R,id)}catch(x){carregando(false);mostraFalha()}},30)};
  img.src=url};
function mostraFalha(){fecharCamera();ir('falha',{})}

/* ---- laço da câmera ao vivo ---- */
function laco(){
  if(!cam.rodando)return;
  if(!cam.ocupado&&!cam.lendo&&Date.now()>cam.pausa&&video.readyState>=2&&video.videoWidth){
    const vw=video.videoWidth,vh=video.videoHeight,f=Math.max(vw,vh)/720;
    peq.width=Math.round(vw/f);peq.height=Math.round(vh/f);peqx.drawImage(video,0,0,peq.width,peq.height);

function aoDetectar(r,f,vw,vh){

    if(!cam.armado){cam.perdido++;if(cam.perdido>=3)cam.armado=true}
    msg(cam.armado?'Mostre o cartão inteiro, com os 4 quadrados pretos':'Agora mostre o próximo cartão');return}
  if(!cam.armado){msg('Agora mostre o próximo cartão');cam.perdido=0;return}
  // resolução do cartão na foto que será lida: pede para aproximar se as bolinhas ficariam pequenas demais

function desenhaOv(q,f,vw,vh){
  const dpr=window.devicePixelRatio||1,cw=ov.clientWidth,ch=ov.clientHeight;
  if(ov.width!==Math.round(cw*dpr)){ov.width=Math.round(cw*dpr);ov.height=Math.round(ch*dpr)}
  const x=ov.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,cw,ch);
  const s=Math.min(cw/vw,ch/vh),ox=(cw-vw*s)/2,oy=(ch-vh*s)/2;
  if(!q){const gh=Math.min(vh*s*0.86,(vw*s*0.92)/0.707),gw=gh*0.707;const gx=(cw-gw)/2,gy=(ch-gh)/2;
    x.setLineDash([12,10]);x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=3;x.strokeRect(gx,gy,gw,gh);x.setLineDash([]);
    x.fillStyle='rgba(255,255,255,.85)';const m=Math.max(14,gw*0.07);[[gx,gy],[gx+gw-m,gy],[gx,gy+gh-m],[gx+gw-m,gy+gh-m]].forEach(([a,b])=>x.fillRect(a,b,m,m));return}
  const P=q.map(c=>[(c.x*f)*s+ox,(c.y*f)*s+oy]);
  x.strokeStyle='#2ecc71';x.lineWidth=5;x.beginPath();x.moveTo(...P[0]);x.lineTo(...P[1]);x.lineTo(...P[3]);x.lineTo(...P[2]);x.closePath();x.stroke();
  x.fillStyle='#2ecc71';for(const[a,b]of P){x.beginPath();x.arc(a,b,10,0,7);x.fill()}
}

function desenhaPrev(cv,img,p,resp,duv,modoGab){
  cv.width=img.width;cv.height=img.height;const x=cv.getContext('2d');x.drawImage(img,0,0);
  const e=img.width/210,L=layout(p),r=L.d/2*e+3;x.lineWidth=3;
  const AT=new Set(ativas(p));
  L.qs.forEach((Q,i)=>{if(!AT.has(i))return;
    if(duv[i]){x.fillStyle='rgba(255,200,0,.3)';x.fillRect((Q.cx0-1)*e,(Q.cy-L.rowH/2)*e,(Q.colW+2)*e,L.rowH*e)}
    const g=p.gab[i],a=resp[i];
    Q.alts.forEach(([bx,by],k)=>{let cor=null;
      if(modoGab){if(a===k)cor='#1f4e8c'}
      else{if(a===k)cor=(g===k||g===-3)?'#17824a':'#c0392b';else if(g===k)cor='rgba(23,130,74,.5)'}
      if(cor){x.strokeStyle=cor;x.beginPath();x.arc(bx*e,by*e,r,0,7);x.stroke()}});
  });
}

  try{
    const rs=ordenaRes(p.res),W=1240,H=1754,M=70,linha=150,porPag=Math.floor((H-M*2-130)/linha),pags=[];
    const carrega=u=>new Promise(r=>{if(!u)return r(null);const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=u});
    const DA=discAtivas(p);
    for(let k=0;k<rs.length;k+=porPag){
      const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#000';
      x.font='bold 40px Arial';x.fillText('Resultado · '+tituloProva(p),M,M+30);
      x.font='26px Arial';x.fillStyle='#444';x.fillText([p.area||p.so>=0?p.nome:'',p.turma?'Turma '+p.turma:'',new Date().toLocaleDateString('pt-BR'),'Página '+(pags.length+1)].filter(Boolean).join('  ·  '),M,M+72);
      x.fillStyle='#000';x.font='bold 24px Arial';const yc=M+120;x.fillText('',M,yc);x.fillText('Nome escrito pelo aluno',M+90,yc);
      const xn=M+90+640;DA.forEach((d,j)=>{x.fillText(DA.length>1?d.nome.slice(0,10):'Nota',xn+j*(DA.length>1?95:120),yc)});
      x.strokeStyle='#000';x.lineWidth=2;x.beginPath();x.moveTo(M,yc+14);x.lineTo(W-M,yc+14);x.stroke();
      const lote=rs.slice(k,k+porPag);
      for(let j=0;j<lote.length;j++){const r=lote[j],y=yc+30+j*linha,cc=corrigir(p,r.resp);
        x.fillStyle='#666';x.font='26px Arial';x.fillText((k+j+1)+'º',M,y+60);
        const im=await carrega(await IDB.get(r.id));
        if(im){x.drawImage(im,M+90,y,620,620*im.height/im.width);x.strokeStyle='#999';x.lineWidth=1;x.strokeRect(M+90,y,620,620*im.height/im.width)}
        else{x.font='24px Arial';x.fillStyle='#888';x.fillText('(sem foto do nome)',M+90,y+60)}
        x.fillStyle='#000';x.font=(DA.length>1?'bold 30px':'bold 44px')+' Arial';cc.disc.forEach((d,jj)=>x.fillText(fmt(d.nota),xn+jj*(DA.length>1?95:120),y+64));
        x.strokeStyle='#ddd';x.lineWidth=1;x.beginPath();x.moveTo(M,y+linha-12);x.lineTo(W-M,y+linha-12);x.stroke()}
      const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));pags.push({jpg:new Uint8Array(await b.arrayBuffer()),w:W,h:H});
    }
    return pdfPaginas(pags);
  }finally{carregando(false)}
}

else if(!DB.cfg.viuTuto&&!DB.provas.length)atual={tela:'tutorial',arg:{i:0}};
else if(DB.ativa&&prova()){pilha=[{tela:'inicio'}];atual={tela:'prova'}}
else atual={tela:'inicio'};

render();
